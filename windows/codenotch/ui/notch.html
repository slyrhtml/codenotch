<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink,#fff)}
  #root{position:relative;width:100%;height:100%;
    --pill:#000;--card:#0a0a0a;--ink:#fff;--track:#303030;--stroke:#2e2e2e;--muted:#808080}
  #root.surface-darkGlass #card,#root.surface-darkGlass #tail,#root.surface-darkGlass .h-disc,
  #root.surface-glass #card,#root.surface-glass #tail,#root.surface-glass .h-disc,
  #root.surface-system #card,#root.surface-system #tail,#root.surface-system .h-disc{
    backdrop-filter:blur(22px) saturate(1.15);-webkit-backdrop-filter:blur(22px) saturate(1.15)}
  #root.surface-darkGlass{--pill:rgba(0,0,0,.52);--card:rgba(10,10,10,.64)}
  #root.surface-glass,#root.surface-system{--pill:rgba(0,0,0,.52);--card:rgba(10,10,10,.64)}
  #root.surface-glass.light,#root.surface-system.light{--pill:rgba(242,242,244,.78);--card:rgba(255,255,255,.82);--ink:#1d1d1f;--track:#c8c8cc;--stroke:#d0d0d4;--muted:#6b6b6b}

  /* One welded notch: the SVG chrome is the body plus both flares, so a corner cannot detach. */
  #notch{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    overflow:visible;
    --fillet:38.7px;--corner:20px;
  }
  #chrome{position:absolute;right:0;top:calc(-1 * var(--fillet));pointer-events:none;display:block;overflow:visible}
  #chrome path{fill:var(--pill)}
  #pill{
    position:relative;
    width:70px;padding:18px 0;background:transparent;
    border:none;box-shadow:none;
    display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;animation:cell-in .42s cubic-bezier(.22,1,.36,1)}
  @keyframes cell-in{from{opacity:0;transform:scale(.82) translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.cell{animation:none}}
  .ringwrap{position:relative;width:56px;height:56px;transition:transform .36s cubic-bezier(.22,1.15,.36,1)}
  .cell.active .ringwrap:not(.pressed){transform:scale(1.06)}
  .ringwrap.pressed{transform:scale(.93)}
  .ringwrap > svg.ring,.ringwrap > svg.reading,.ringwrap > svg.activity{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.5px;
  }
  .glyph.small{font-size:15px}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:26px;height:26px;color:var(--ink)}
  .glyph .mark svg{width:26px;height:26px;fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:26px;height:26px;object-fit:contain}
  .glyph img.appicon{width:30px;height:30px;border-radius:8px;object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:var(--ink);margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .dim{opacity:.55}
  /* A stale reading dims the reading only. The track, the week and the glyph are all saying the same
     old thing, but whether an agent is running right now is current either way, so the activity arc
     keeps its strength — the Mac puts its own ActivityArc outside the opacity it gives the stale
     stack (ProviderRing), and TASKS.md says it outright: dimming applies to the usage reading. */
  .ringwrap.stale > svg.ring,.ringwrap.stale > svg.reading,.ringwrap.stale > .glyph{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* A 60 fps SVG transform animation in a transparent always-on-top window slows the whole desktop
     compositor (other apps stutter). steps() drops repaints to ~10 fps; it still reads as spinning/breathing. */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  /* Windows' Animation effects switch: a still arc and a solid ring, as on the Mac under Reduce Motion */
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}.ringwrap{transition:none}}

  /* Hover card, shown beside the hovered ring. Mac unfold/glide: spring in, ease out. */
  #card{
    --out-x:16px;--out-y:0px;
    position:absolute;left:10px;right:84px;top:50%;
    max-width:246px;margin-left:auto;background:var(--card);border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% / var(--card-zoom, 1) - 16px);overflow:hidden;
    display:block;visibility:hidden;opacity:0;pointer-events:none;
    transform:translate(var(--out-x), var(--out-y));
    transition:opacity .18s ease-out,transform .18s ease-out,visibility 0s linear .18s,top .5s cubic-bezier(.22,1,.36,1),left .5s cubic-bezier(.22,1,.36,1);
  }
  #card.show{
    visibility:visible;opacity:1;pointer-events:auto;
    transform:none;
    transition:opacity .42s cubic-bezier(.22,1,.36,1),transform .42s cubic-bezier(.22,1,.36,1),visibility 0s,top .5s cubic-bezier(.22,1,.36,1),left .5s cubic-bezier(.22,1,.36,1);
  }
  #card,#tail{zoom:var(--card-zoom,1)}
  #tail{
    position:absolute;right:69px;width:16px;height:36px;background:var(--card);
    clip-path:path('M0 0C0 9 9.28 13.68 16 18C9.28 22.32 0 27 0 36Z');
    visibility:hidden;opacity:0;pointer-events:none;
    transition:opacity .18s ease-out,visibility 0s linear .18s;
  }
  #card.show + #tail{
    visibility:visible;opacity:1;pointer-events:auto;
    transition:opacity .42s cubic-bezier(.22,1,.36,1),visibility 0s;
  }
  @media (prefers-reduced-motion: reduce){
    #card,#tail,#card.show,#card.show + #tail{transition:none}
  }
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:var(--muted);margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:var(--ink);font-weight:600;white-space:nowrap}
  .w-reset{color:var(--muted);font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:var(--track);margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:var(--muted)}
  .g-head{font-size:12px;font-weight:700;color:var(--ink);margin-top:12px}
  .g-box{border:1px solid var(--stroke);border-radius:10px;padding:0 10px 8px;margin-top:6px}
  .c-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid var(--stroke);padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-more{font-size:11px;color:var(--muted);padding:2px 0}

  /* ---- The other three edges -------------------------------------------------
     The rules above draw the right-hand edge, the original layout and still the default. Each block
     below mirrors or rotates that one for another edge. Two things stay in JavaScript because they
     depend on measurement: where the card and the tail sit along the pill (`placeCard`), and, on the
     flat edges, how far down or up the card clears a pill whose thickness follows its contents.

     The fillets follow one rule on every edge: the radial gradient is centred on the corner of the
     R×R square *diagonally opposite* the corner where the pill meets the screen, so the remaining
     arc uses the same fill as the pill. */

  body[data-edge="left"] #notch{right:auto;left:0}
  body[data-edge="left"] #chrome{right:auto;left:0}
  body[data-edge="left"] #card{left:84px;right:10px;margin-left:0;margin-right:auto;--out-x:-16px;--out-y:0px}
  body[data-edge="left"] #tail{right:auto;left:69px;clip-path:path('M16 0C16 9 6.72 13.68 0 18C6.72 22.32 16 27 16 36Z')}

  body[data-edge="top"] #notch,body[data-edge="bottom"] #notch{
    right:auto;left:50%;top:auto;transform:translateX(-50%);
  }
  body[data-edge="top"] #notch{top:0}
  body[data-edge="bottom"] #notch{bottom:0}
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{
    flex-direction:row;width:auto;height:auto;padding:12px 18px;
  }
  body[data-edge="top"] #chrome{top:0;right:auto;left:calc(-1 * var(--fillet))}
  body[data-edge="bottom"] #chrome{top:auto;bottom:0;right:auto;left:calc(-1 * var(--fillet))}
  body[data-edge="top"] #card,body[data-edge="bottom"] #card{
    left:8px;right:auto;top:0;margin-left:0;
    width:246px;max-height:calc(100% / var(--card-zoom, 1) - 150px);
  }
  body[data-edge="top"] #card{--out-x:0px;--out-y:-14px}
  body[data-edge="bottom"] #card{--out-x:0px;--out-y:14px}
  body[data-edge="top"] #tail,body[data-edge="bottom"] #tail{right:auto;width:36px;height:16px}
  body[data-edge="top"] #tail{clip-path:path('M0 16C9 16 13.68 6.72 18 0C22.32 6.72 27 16 36 16Z')}
  body[data-edge="bottom"] #tail{clip-path:path('M0 0C9 0 13.68 9.28 18 16C22.32 9.28 27 0 36 0Z')}

  /* The two handles, one off each end of the pill, as on the Mac (SettingsOrb and MoveHandle):
     settings past the far fillet, move past the near one. At rest each is a quarter arc tucked into
     that fillet's pocket, concentric with it and a gap inside; under the pointer the same circle
     fills in and takes its glyph. The Mac's measures, unscaled: arc radius 28.5, stroke 6.8, disc
     46.6, glyph 21. `placeHandles` puts each box's centre on its fillet's centre. */
  .handle{position:absolute;width:57px;height:57px;display:none;--arc:270deg}
  .handle.placed{display:block}
  .handle.hover{cursor:pointer}
  .handle > *{position:absolute;left:50%;top:50%;pointer-events:none;transition:opacity .2s,transform .36s cubic-bezier(.34,1.3,.64,1)}
  .h-rest{width:72px;height:72px;margin:-36px 0 0 -36px;overflow:visible;transform:rotate(var(--arc)) scale(1)}
  .h-rest .h-stroke,.h-rest .h-fill{stroke:var(--pill)}
  .h-disc{width:46.6px;height:46.6px;margin:-23.3px 0 0 -23.3px;border-radius:50%;background:var(--pill);border:none;opacity:0;transform:scale(1.1)}
  .h-glyph{width:21px;height:21px;margin:-10.5px 0 0 -10.5px;fill:var(--ink);opacity:0;
    transform:rotate(calc(var(--spins,0) * 360deg - 60deg)) scale(.5);transition:opacity .2s,transform .55s cubic-bezier(.34,1.2,.64,1)}
  .handle.hover .h-rest{opacity:0;transform:rotate(var(--arc)) scale(.86)}
  .handle.hover .h-disc{opacity:1;transform:scale(1)}
  .handle.hover .h-glyph{opacity:1;transform:rotate(calc(var(--spins,0) * 360deg)) scale(1)}
  /* Carrying: the disc goes dashed and the hand stops turning — it is being held now, not offered */
  #move.armed .h-disc{border:2px dashed var(--ink);background:var(--pill)}
  /* The quarter that faces the fillet: up and outward past the far end on the right, and the same two
     directions mirrored along the stack at the near end */
  body[data-edge="left"] #orb,body[data-edge="top"] #orb{--arc:180deg}
  body[data-edge="bottom"] #orb{--arc:90deg}
  #move{--arc:0deg}
  body[data-edge="left"] #move{--arc:90deg}
  body[data-edge="top"] #move{--arc:270deg}
  @media (prefers-reduced-motion: reduce){.handle > *{transition:none}}
</style>
</head>
<body>
<div id="root">
  <div id="card"></div>
  <div id="tail"></div>
  <div id="move" class="handle">
    <svg class="h-rest" viewBox="-36 -36 72 72" aria-hidden="true">
      <circle class="h-stroke" r="28.5" fill="none" stroke-width="8.8" stroke-linecap="round" stroke-dasharray="44.77 179.07"/>
      <circle class="h-fill" r="28.5" fill="none" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="44.77 179.07"/>
    </svg>
    <div class="h-disc"></div>
    <!-- A hand, as on the Mac: the gesture is a carry, not a nudge, which is what arrows would say -->
    <svg class="h-glyph" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 13V5.6a1.5 1.5 0 0 1 3 0V11h.6V3.5a1.5 1.5 0 0 1 3 0V11h.6V5a1.5 1.5 0 0 1 3 0v8.4c0 4.2-2 7.1-5.6 7.1-2.4 0-3.8-1-5.1-2.7l-3.8-5a1.5 1.5 0 0 1 2.2-2z"/>
    </svg>
  </div>
  <div id="orb" class="handle">
    <svg class="h-rest" viewBox="-36 -36 72 72" aria-hidden="true">
      <circle class="h-stroke" r="28.5" fill="none" stroke-width="8.8" stroke-linecap="round" stroke-dasharray="44.77 179.07"/>
      <circle class="h-fill" r="28.5" fill="none" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="44.77 179.07"/>
    </svg>
    <div class="h-disc"></div>
    <svg class="h-glyph" viewBox="0 0 12 12" aria-hidden="true"><path fill-rule="evenodd" d="M5.1.6h1.8l.3 1.5 1.1.5 1.3-.8 1.3 1.3-.8 1.3.5 1.1 1.5.3v1.8l-1.5.3-.5 1.1.8 1.3-1.3 1.3-1.3-.8-1.1.5-.3 1.5H5.1l-.3-1.5-1.1-.5-1.3.8-1.3-1.3.8-1.3-.5-1.1L.6 6.9V5.1l1.5-.3.5-1.1-.8-1.3 1.3-1.3 1.3.8 1.1-.5zM6 4.1a1.9 1.9 0 1 0 0 3.8 1.9 1.9 0 0 0 0-3.8z"/></svg>
  </div>
  <div id="notch">
    <svg id="chrome" aria-hidden="true"><path></path></svg>
    <div id="pill"></div><!-- one .cell per provider, stacked vertically (upstream: data-driven, the same layout for 1–5 cells) -->
  </div>
  <div id="notice"></div>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

/* Colour ramp (upstream palette values) */
const AMPLE='#00FF88', WATCH='#F2FF00', CRIT='#FF3F00';
const ACCENTS={system:'#00FF88',ff33e1:'#FF33E1',eb4236:'#EB4236',eb8436:'#EB8436',ffd400:'#FFD400',
  '00ff88':'#00FF88','00e5cc':'#00E5CC','36a8eb':'#36A8EB','6c5ce7':'#6C5CE7',b026ff:'#B026FF',f7f6f5:'#F7F6F5'};
let appearance={accent_color:'system',surface_style:'glass'};
function ample(){ return ACCENTS[appearance.accent_color] || AMPLE; }
// The status arc is neutral on purpose: the ring behind it is coloured by how much of the limit
// is gone, and a green arc inside it reads as part of that scale. Waiting borrows the warning yellow.
const TRACK='#303030', INK='#ffffff', DIM='#808080';
const tone=f=> f>=0.8?CRIT : f>=0.5?WATCH : ample();
function applyAppearance(){
  const root=document.getElementById('root');
  if(!root) return;
  root.classList.remove('surface-solid','surface-darkGlass','surface-system','surface-glass','light');
  let style=appearance.surface_style||'glass';
  if(style==='system') style='glass';
  root.classList.add('surface-'+style);
  if(style==='glass' && !matchMedia('(prefers-color-scheme: dark)').matches) root.classList.add('light');
}
function readAppearance(v){
  if(!v||typeof v!=='object') return;
  appearance={
    accent_color:v.accent_color||v.accentColor||'system',
    surface_style:v.surface_style||v.surfaceStyle||'solid'
  };
  applyAppearance();
  if(typeof renderRing==='function') renderRing();
  const shown=document.getElementById('card');
  if(typeof renderCard==='function' && shown && shown.classList.contains('show')) renderCard();
}
applyAppearance();
let dockScale=1, cardScale=1;
function cardZoom(){ return Math.max(0.25, cardScale/Math.max(0.01, dockScale)); }
function cardRoom(){ return Math.max(cardZoom(), 1); }
function applyCardZoom(){
  document.documentElement.style.setProperty('--card-zoom', String(cardZoom()));
  if(typeof fitZoom==='function') fitZoom();
  if(typeof placeCard==='function' && typeof card!=='undefined' && card && card.classList.contains('show')) placeCard();
  if(typeof reportHot==='function') reportHot();
}
function readScales(v){
  if(!v||typeof v!=='object') return;
  if(typeof v.scale==='number') dockScale=v.scale;
  const cs=v.card_scale!=null?v.card_scale:v.cardScale;
  if(typeof cs==='number') cardScale=cs;
  applyCardZoom();
}
function cssVar(name, fallback){
  const root=document.getElementById('root');
  const v=root && getComputedStyle(root).getPropertyValue(name).trim();
  return v||fallback;
}
function track(){ return cssVar('--track', TRACK); }
function ink(){ return cssVar('--ink', INK); }
// Whole percents, except where rounding would read as nothing used or nothing left, as the Mac's Percent does
function smallPct(v){
  if(v<=0) return '0';
  const t=Math.round(v*10)/10;
  if(t<0.1) return '<0.1';
  if(t>99.9) return '>99.9';
  return t.toFixed(1);
}
function pctText(f){ const v=f*100; return v>0&&v<1?smallPct(v):String(Math.round(v)); }
// Both ends, since vendors disagree on which they print; the left half comes from the rounded used half, as their dashboards do
function usedCopy(w){
  const v=w.used*100;
  let used, left;
  if((v>0&&v<1)||(v>99&&v<100)){ used=smallPct(v); left=100-v>99.9?'>99.9':smallPct(Math.max(0,100-v)); }
  else { const u=Math.round(v); used=String(u); left=String(Math.max(0,100-u)); }
  if(w.derived) used='~'+used;
  return ui().usedLeft(used,left);
}

let usage={status:'',windows:[],fetched_at:0,note:''};
let codexSnap={status:'absent',windows:[],fetched_at:0,note:''};
let cursorSnap={status:'absent',windows:[],fetched_at:0,note:''};
// Grok Build credits, from the Grok CLI's own session; absent until that CLI is signed in
let grokSnap={status:'absent',windows:[],fetched_at:0,note:''};
let agSnap={status:'absent',windows:[],fetched_at:0,note:''};
const EXTRA_PROVIDERS=[
  {id:'glm',name:'GLM',glyph:'G'},
  {id:'opencode',name:'OpenCode',glyph:'Oc'},
  {id:'commandcode',name:'Command Code',glyph:'Cc'},
  {id:'copilot',name:'Copilot',glyph:'Cp'},
  {id:'kimi',name:'Kimi',glyph:'Km'},
  {id:'kiro',name:'Kiro',glyph:'Ki'},
  {id:'ollama',name:'Ollama',glyph:'Ol'},
  {id:'ollama-local',name:'Ollama',glyph:'O'},
  {id:'lmstudio',name:'LM Studio',glyph:'Lm'},
  {id:'minimax',name:'MiniMax',glyph:'Mm'}
];
const extraSnaps={};
for(const p of EXTRA_PROVIDERS) extraSnaps[p.id]={status:'absent',windows:[],fetched_at:0,note:''};
let glyphs={}; // id → {kind:'mark'|'appicon', url}
let activity=[]; // working state of the non-Claude providers: {provider,state:'busy'|'waiting',name,detail,since}
/* Which screen edge the notch is pinned to. Rust owns it (it is what placed the window); the page is
   told so it can mirror or rotate itself to match. 'right' is the default and the pre-edge layout. */
let notchEdge='right';
/* How much of the window the taskbar covers, in CSS px, from Rust: top, right, bottom, left. The pill
   stays against the screen edge; the card is kept out of these. */
let insets=[0,0,0,0];
function applyInsets(v){
  const next=Array.isArray(v)&&v.length===4?v.map(n=>Math.max(0,Number(n)||0)):[0,0,0,0];
  if(next.every((n,i)=>n===insets[i])) return;
  insets=next;
  if(card&&card.classList.contains('show')){ placeCard(); reportHot(); }
}
// Pushed on every placement, and asked for once in case the placement happened before this page was listening
listen('notch_insets',e=>applyInsets(e.payload)).catch(()=>{});
invoke('get_notch_insets').then(applyInsets).catch(()=>{});
function edgeIsVertical(){ return notchEdge==='left'||notchEdge==='right'; }
function applyEdge(e){
  const next=(e==='left'||e==='top'||e==='bottom')?e:'right';
  if(next===notchEdge) return;
  notchEdge=next;
  document.body.dataset.edge=next;
  // The window changes shape with the edge, and so does the width the zoom correction measures against
  reportDpr();
  if(typeof paintChrome==='function') paintChrome();
  // The pill changes shape, so both the hot rectangles and the card's anchor have to be measured again
  if(card&&card.classList.contains('show')) placeCard();
  reportHot();
}
let uiLang='en';
// The tray menu already speaks four languages: i18n.rs resolves the user's locale to zh, ja, ko
// or ru, and main.rs hands the result to this page as `lang_resolved`. The card understood only
// Russian, so a Chinese machine showed a translated menu above an English card. Everything a
// provider or this page can put on the card is keyed by that same language code below:
// TEXT for whole strings, PATTERNS for the ones carrying a number or a plan name, UI for the
// words the card writes itself. A language with no table falls back to English rather than
// showing half a translation, so adding one is only ever data.
const TEXT={
  uk:{
    'Included usage':'Використання в тарифі',
    'API usage':'Використання API',
    'On demand':'За потребою',
    'Usage':'Використання',
    'Current session':'Поточна сесія',
    'Weekly (all models)':'Тижневий (усі моделі)',
    'Weekly (Opus)':'Тижневий (Opus)',
    'Weekly (model-scoped)':'Тижневий (для вибраної моделі)',
    'Weekly limit':'Тижневий ліміт',
    'Weekly Limit':'Тижневий ліміт',
    '5-Hour Limit':'Ліміт 5 годин',
    '5-hour Limit':'Ліміт 5 годин',
    'Gemini Models':'Моделі Gemini',

    if(activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);

function glyphHtml(p,small){

function providers(){

  if(cursorSnap.status!=='absent') list.push({id:'cursor',name:'Cursor',glyph:'Cu',snap:cursorSnap});
  if(grokSnap.status!=='absent') list.push({id:'grok',name:'Grok',glyph:'Gk',snap:grokSnap});

// The tightest metered window, ties going to the lower id so the choice never flickers
function tightestOf(ws){
  return ws.filter(w=>w.count==null).reduce((a,b)=>!a||b.used>a.used||(b.used===a.used&&b.id<a.id)?b:a,null);
}
function laneFamily(w){ const id=w.id.toLowerCase(); return id.startsWith('gemini')?'gemini':(id.startsWith('3p')||id.startsWith('claude'))?'3p':''; }
function laneIs(w,limit){

  if(id==='cursor') return byId('included')||byId('api');
  if(id==='grok') return byId('credits')||ws[0];

  if(id==='opencode'||id==='kimi') return byId('rolling')||byId('weekly')||ws[0];
  if(id==='commandcode') return byId('monthly')||ws[0];
  if(id==='copilot') return byId('premium_interactions')||ws[0];
  if(id==='kiro') return byId('credits')||ws[0];
  if(id==='ollama') return byId('monthly')||byId('weekly')||byId('session')||ws[0];

// The weekly window each provider reports, or null where there is none: Claude names it seven_day,

function weeklyOf(snap,id){
  const ws=snap.windows.filter(w=>w.count==null); if(!ws.length) return null;
  const byId=x=>ws.find(w=>w.id===x)||null;
  if(id==='claude') return byId('seven_day')||byId('weekly_all')||byId('weekly');
  if(id==='codex') return byId('secondary');
  if(id==='cursor') return null;
  if(id==='grok') return null; // the credits window is already the weekly one
  if(id==='glm'||id==='opencode'||id==='commandcode'||id==='kimi'||id==='minimax') return byId('weekly');
  if(id==='ollama') return byId('weekly');

  if(id!=='gemini') return null;

function svgArc(r,frac,color,width,extra=''){
  // Nothing at all at zero: a zero-length dash still paints a dot once the caps are round, where the
  // Mac's `trim(from: 0, to: 0)` draws nothing. A reading small enough that its two caps meet does
  // draw as a dot, on both platforms — `ProviderRing.sweep` has no floor. Upstream #260 argues that
  // is wrong, for the local model's arc; if it lands, the same floor belongs here.
  if(!(frac>0)) return '';
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="round"
    transform="rotate(-90 28 28)" ${extra}/>`;
}

function chromePath(edge,w,h,R,C){

  }
  if(edge==='top'){
    return `M0,0A${R},${R} 0 0 1 ${R},${R}L${R},${h-C}A${C},${C} 0 0 0 ${R+C},${h}L${R+w-C},${h}A${C},${C} 0 0 0 ${R+w},${h-C}L${R+w},${R}A${R},${R} 0 0 1 ${w+2*R},0Z`;

    return `M0,${h}A${R},${R} 0 0 0 ${R},${h-R}L${R},${C}A${C},${C} 0 0 1 ${R+C},0L${R+w-C},0A${C},${C} 0 0 1 ${R+w},${C}L${R+w},${h-R}A${R},${R} 0 0 0 ${w+2*R},${h}Z`;
  }

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return ui().resetting;
  const min=Math.round(diff/60000); // rounded before the test, so 59m40s never reads "Resets in 60 min"
  if(min<60) return ui().resetsIn(Math.max(1,min));
  const d=new Date(ms), locale=ui().locale;
  // A weekday only names a day in the coming week: a Codex monthly reset 26 days out read as this Monday
  if(daysApart(Date.now(),ms)>=7) return ui().resetsDate(d.toLocaleDateString(locale,{month:'short',day:'numeric'}));
  const t=d.toLocaleTimeString(locale,{hour:'numeric',minute:'2-digit',hourCycle:stateSnap.clock_24h?'h23':'h12'});
  if(diff<24*60*60*1000) return ui().resetsAt(t);
  return ui().resetsOn(d.toLocaleDateString(locale,{weekday:'short'}),t);
}
// Calendar days rather than 24-hour blocks, so a clock change cannot move the answer
function daysApart(from,to){
  const day=ms=>{const d=new Date(ms); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();};
  return Math.round((day(to)-day(from))/86400000);
}

function ago(ms){

    const who={claude:'Sign in to Claude Code to see usage.',cursor:'Sign in to Cursor to see usage.',codex:'Sign in to Codex to see usage.',grok:'Run grok login to see usage.',gemini:'Sign in to Antigravity to see usage.'}[p.id]||'';

function placeCard(){

  const rr=(cell.querySelector('.ringwrap')||cell).getBoundingClientRect();

    const cy=rr.top+rr.height/2;

// Viewport fit (pure front-end fallback, independent of Rust): Rust sizes and zooms the window so this
// page is as wide as the design, so if the CSS viewport is not that wide the WebView's DPR disagrees
// with the monitor; CSS zoom pulls the layout back to the design size.
// The design width is the window's, and the window is not the same shape on every edge — see
// `notch_window_size` in main.rs: NOTCH_W upright, NOTCH_H lying flat. Dividing by 360 on a flat edge
// read the wider window as a DPR error and zoomed the whole notch by 520/360.
const DESIGN_W_UPRIGHT=360, DESIGN_W_FLAT=520;
function designWidth(){ return (edgeIsVertical()?DESIGN_W_UPRIGHT:DESIGN_W_FLAT)*cardRoom(); }
function fitZoom(){
  const z=innerWidth/designWidth();
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
}
// Not measured yet: the width to measure against depends on the edge, and only Rust knows it. The
// ask is at the bottom of this file and answers in a round trip; measuring first would zoom a flat
// window by 520/360 for that moment.
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{paintChrome();reportDpr();reportHot();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',reportDpr);

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  for(const el of pill.querySelectorAll('.cell')){ if(inRect(x,y,el.getBoundingClientRect(),6)) return el.dataset.p; }
  return null;
}
function pointerInHot(x,y){
  const p=pill.getBoundingClientRect();
  if(inRect(x,y,p,4))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  if(dragging)return; // no card while dragging
  if(carrying) return; // the notch is in hand; the card would only be in the way
  setHovered(onHandle(e.clientX,e.clientY));
  if(hovered){ if(card.classList.contains('show')){ clearTimeout(hideTimer); hideCard(); } return; }
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; markActive(id); if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    if(!card.classList.contains('show')) showCard();
  }
  else if(card.classList.contains('show')){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget && card.classList.contains('show')){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); }
});
listen('pointer_left',()=>{clearTimeout(hideTimer);hideCard();}).catch(()=>{});
// Card content changes change its height -> report the hot rectangles again
listen('usage',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
/* The pill can be dragged up and down the right edge. Press and move more than 4 px = drag (handed to Rust,
   which follows the system cursor; the card is collapsed first); release without moving = click (refetches that ring). */
let press=null, dragging=false;
/* As on the Mac, a clicked ring presses in until its reading lands, and the reading turns once.
   Each provider's reading listener below calls settle() for its ring; PRESS_MAX is only the fallback.
   Rust answers false when no reading is coming (Claude inside its rate-limit wait). */
const PRESS_MIN=380, PRESS_MAX=6000;
const refreshing={};
function refreshRing(id){
  if(refreshing[id]) return;
  refreshing[id]={at:Date.now(),timer:setTimeout(()=>settle(id),PRESS_MAX)};
  renderRing();
  turnReading(id);
  invoke('refresh_ring',{provider:id}).then(coming=>{if(!coming)settle(id);}).catch(()=>settle(id));
}
// The reading has a layer of its own that renders never replace, turned as a whole element so the
// compositor can run it; it finishes its turn whenever the press lets go
function turnReading(id){
  const el=pill.querySelector(`.cell[data-p="${id}"] svg.reading`);
  if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(el.getAnimations().some(a=>a.playState==='running')) return;
  el.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:950,easing:'cubic-bezier(.32,0,.14,1)'});
}
function settle(id){
  const r=refreshing[id]; if(!r) return;
  clearTimeout(r.timer);
  const wait=r.at+PRESS_MIN-Date.now();
  if(wait>0){ r.timer=setTimeout(()=>settle(id),wait); return; }
  delete refreshing[id];
  renderRing();
}
pill.addEventListener('mousedown',e=>{ if(e.button!==0)return; press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId}; });
document.addEventListener('mousemove',e=>{
  if(!press||dragging)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; clearTimeout(hideTimer); hideCard();
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;});
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(press&&!dragging&&press.id) refreshRing(press.id);
  press=null;
});
// The Mac's right-click menu, naming the ring or card under the pointer; WebView2's own menu never shows
document.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(dragging||!pointerInHot(e.clientX,e.clientY)) return;
  invoke('show_notch_menu',{provider:cellAt(e.clientX,e.clientY)||hoverId}).catch(err=>notice('show_notch_menu failed: '+err));
});
listen('drag_end',()=>{dragging=false;press=null;reportHot();}).catch(()=>{});

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

/* ---- The handles ----------------------------------------------------------
   Settings past the far end of the pill, move past the near one. Placed whenever the hot rectangles
   are reported, since those follow every change to the pill. Hover is a circle round each fillet's
   centre, as on the Mac, not the whole box; the card gives way while either is under the pointer.
   A click on the settings orb opens Settings; holding the move handle carries the notch. */
const orb=document.getElementById('orb'), moveHandle=document.getElementById('move');
const HANDLE_REACH=28.5; // the Mac's hot zone, half of 57
let orbAt=null, moveAt=null, hovered=null, orbSpins=0, moveSpins=0, showMove=true, carrying=false;
function put(el,x,y,z){
  el.style.left=(x/z-HANDLE_REACH)+'px'; el.style.top=(y/z-HANDLE_REACH)+'px';
  el.classList.add('placed');
  return {x,y,reach:HANDLE_REACH*z};
}
function placeHandles(){
  const r=pill.getBoundingClientRect();
  if(!r.width) return false;
  // Measurements come back zoomed when fitZoom has zoomed the page; styles are written unzoomed
  const z=parseFloat(document.documentElement.style.zoom)||1;
  const host=document.getElementById('notch')||pill;
  const R=(parseFloat(getComputedStyle(host).getPropertyValue('--fillet'))||38.7)*z;
  // Each fillet's centre: the corner of its square diagonally opposite the one on the screen edge
  const far=notchEdge==='left'?[r.left+R,r.bottom+R]:notchEdge==='top'?[r.right+R,r.top+R]
    :notchEdge==='bottom'?[r.right+R,r.bottom-R]:[r.right-R,r.bottom+R];
  const near=notchEdge==='left'?[r.left+R,r.top-R]:notchEdge==='top'?[r.left-R,r.top+R]
    :notchEdge==='bottom'?[r.left-R,r.bottom-R]:[r.right-R,r.top-R];
  orbAt=put(orb,far[0],far[1],z);
  // No point at all when it is switched off, since hover, the press and the hot area all read this
  moveAt=showMove?put(moveHandle,near[0],near[1],z):null;
  if(!showMove) moveHandle.classList.remove('placed','hover');
  return true;
}
function near(at,x,y){ return !!at&&Math.hypot(x-at.x,y-at.y)<=at.reach; }
function onHandle(x,y){ return near(orbAt,x,y)?'orb':near(moveAt,x,y)?'move':null; }
function setHovered(which){
  if(which===hovered) return;
  hovered=which;
  orb.classList.toggle('hover',which==='orb');
  moveHandle.classList.toggle('hover',which==='move'||carrying);
}
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget&&!carrying) setHovered(null); });
orb.addEventListener('click',e=>{
  if(!near(orbAt,e.clientX,e.clientY)) return;
  orb.style.setProperty('--spins',++orbSpins);
  pressIn(orb);
  callq('open_settings').catch(()=>{});
});
// The Mac's press: down fast, back with a little bounce
function pressIn(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.animate([{transform:'scale(1)',easing:'ease-out'},{transform:'scale(.84)',offset:.21,easing:'cubic-bezier(.34,1.56,.64,1)'},{transform:'scale(1)'}],{duration:430});
}
/* Holding the move handle puts the notch in hand: Rust raises the drop zones and follows the pointer
   until the button comes up. The notch itself does not move — what is being chosen is a place on the
   screen, not a distance. The pill's own size goes with it, so a zone is the notch, not a guess. */
/* The shape the zones draw: the pill standing upright, whichever edge it is on now. Worked out from
   the parts it is made of rather than measured, so a notch lying flat still offers the same
   silhouette everywhere — the 70 px depth and the 18 px end padding are the pill's own, from the CSS
   above. The notch really is shallower and shorter lying flat, but drawing that would offer four
   outlines of two sizes, which reads as four different things instead of one notch offered a place. */
function pillShapes(){
  const cells=Math.max(1,pill.querySelectorAll('.cell').length);
  const ring=(pill.querySelector('.ringwrap')||{}).offsetHeight||56;
  const label=(pill.querySelector('.pct')||{}).offsetHeight||20;
  const ends=36, between=14, underRing=6;
  return { depth:70, length:ends+cells*(ring+underRing+label)+(cells-1)*between };
}
moveHandle.addEventListener('mousedown',e=>{
  if(e.button!==0||!near(moveAt,e.clientX,e.clientY)) return;
  e.stopPropagation();
  carrying=true;
  moveHandle.classList.add('armed','hover');
  moveHandle.style.setProperty('--spins',++moveSpins);
  clearTimeout(hideTimer); hideCard();
  callq('begin_move',pillShapes()).catch(()=>{carrying=false;moveHandle.classList.remove('armed');});
});
listen('move_end',()=>{ carrying=false; moveHandle.classList.remove('armed'); setHovered(null); reportHot(); }).catch(()=>{});
listen('move_handle',e=>{ showMove=e.payload!==false; reportHot(); }).catch(()=>{});
invoke('get_move_handle').then(v=>{ showMove=v!==false; reportHot(); }).catch(()=>{});

listen('usage',e=>{usage=e.payload||usage;settle('claude');renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(usage) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',e=>{codexSnap=e.payload||codexSnap;settle('codex');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('cursor',e=>{cursorSnap=e.payload||cursorSnap;settle('cursor');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_cursor').then(u=>{cursorSnap=u||cursorSnap;renderRing();}).catch(()=>{});
listen('grok',e=>{grokSnap=e.payload||grokSnap;settle('grok');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_grok').then(u=>{grokSnap=u||grokSnap;renderRing();}).catch(()=>{});

listen('antigravity',e=>{agSnap=e.payload||agSnap;settle('gemini');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_antigravity').then(u=>{agSnap=u||agSnap;renderRing();}).catch(()=>{});
for(const p of EXTRA_PROVIDERS){
  listen(p.id,e=>{extraSnaps[p.id]=e.payload||extraSnaps[p.id];settle(p.id);renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
  invoke('get_provider',{id:p.id}).then(u=>{if(u) extraSnaps[p.id]=u;renderRing();}).catch(()=>{});
}
invoke('get_notch_slots').then(v=>{if(Array.isArray(v)){notchSlots=v;renderRing();}}).catch(()=>{});
listen('notch_slots',e=>{
  notchSlots=Array.isArray(e.payload)?e.payload:null;
  renderRing();
  if(card.classList.contains('show')){renderCard();armWatchdog();}
}).catch(()=>{});
invoke('get_appearance').then(readAppearance).catch(()=>{});
listen('appearance',e=>readAppearance(e.payload)).catch(()=>{});
invoke('get_scale').then(s=>{ if(typeof s==='number') dockScale=s; applyCardZoom(); }).catch(()=>{});
invoke('get_card_scale').then(s=>{ if(typeof s==='number') cardScale=s; applyCardZoom(); }).catch(()=>{});
listen('notch_scale',e=>readScales(e.payload)).catch(()=>{});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
  applyAppearance();
  renderRing();
  if(card.classList.contains('show')) renderCard();
});
invoke('get_antigravity_prefs').then(p=>{if(p){agPrefs=p;renderRing();}}).catch(()=>{});
invoke('get_weekly_ring').then(v=>{if(typeof v==='string'){weeklyRing=v;renderRing();}}).catch(()=>{});
listen('weekly_ring',e=>{if(typeof e.payload==='string'){weeklyRing=e.payload;renderRing();}}).catch(()=>{});
listen('antigravity_prefs',e=>{if(e.payload){agPrefs=e.payload;renderRing();}}).catch(()=>{});
listen('glyphs',e=>{glyphs=e.payload||glyphs;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('activity',e=>{activity=e.payload||activity;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_activity').then(a=>{activity=a||activity;renderRing();}).catch(()=>{});
invoke('get_glyphs').then(g=>{glyphs=g||glyphs;renderRing();}).catch(()=>{});
// The edge: pushed on every placement (a drag that snapped elsewhere, or Settings), and asked for once
// at startup in case the placement happened before this page was listening.
listen('notch_edge',e=>applyEdge(e.payload)).catch(()=>{});
// applyEdge measures for the edge it is given; on the right-hand one it returns early, so the first
// measurement is made here either way — and still made if the ask fails, from the default edge.
invoke('get_notch_edge').then(e=>{applyEdge(e);reportDpr();}).catch(()=>reportDpr());
invoke('get_codex').then(u=>{codexSnap=u||codexSnap;renderRing();}).catch(()=>{});
invoke('get_usage').then(u=>{usage=u||usage;renderRing();}).catch(e=>notice('get_usage failed: '+e));
invoke('get_state').then(s=>{stateSnap=s||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();}).catch(()=>{});
setInterval(renderRing,30_000); // stale state and reset copy move with time
</script>
</body>
</html>
